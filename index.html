<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atlas — abrir e acompanhar chamados</title>
    <meta
      name="description"
      content="Porta de entrada interna para chamados do time de tech da Gocase."
    />
    <!-- Ver o comentário dentro do próprio `public/favicon.svg`. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ⚠️ Poppins carregada SEM bloquear o primeiro paint: `media="print"` baixa em
         prioridade baixa, `onload` promove para `all`. `&display=swap` não substitui
         isto — ele governa quando o TEXTO troca de fonte, não quando a PÁGINA pinta.
         Voltar a um `<link>` comum "para não piscar" devolve a espera ao caminho
         crítico; ver a seção de desempenho no `CLAUDE.md`. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
