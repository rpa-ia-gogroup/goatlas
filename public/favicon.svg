<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="goatlas">
  <!--
    A marca do goatlas, na mesma família do godocs: fundo azul com canto generoso, um
    OBJETO CONCRETO em branco, um acento lime na quina desse objeto, e a inicial
    recortada em azul dentro dele.

    Lá o objeto é uma folha com o canto dobrado, porque o godocs é sobre documento.
    Aqui é um balão de conversa, porque o goatlas é uma conversa que vira chamado: a
    tela principal é o agente, e o formulário existe como caminho alternativo. Um ícone
    de ticket descreveria o resultado; o balão descreve o que a pessoa faz.

    Comentário de SVG é comentário de XML, e dois hifens seguidos quebram o arquivo
    inteiro sem o navegador reclamar em lugar nenhum.
  -->
  <defs>
    <!--
      A sombra é pequena de propósito: ela existe para descolar o balão do azul, não
      para simular profundidade. Favicon a 16 px não mostra sombra nenhuma, e um borrão
      maior só apareceria como sujeira na borda.
    -->
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#00305c" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0059A9" />

  <g filter="url(#sombra)">
    <!--
      ⚠️ A cauda vem ANTES do balão, e a ordem é o desenho.

      Depois dele, ela aparecia inteira POR CIMA do branco — um triângulo verde deitado
      sobre o balão, que é exatamente o que nenhum balão de fala parece. Atrás, só
      assoma o pedaço que passa da borda, como a ponta de um balão de verdade. Por isso
      ela nasce acima da base (y=300, contra 342 da borda): o trecho escondido é o que
      garante que não sobre uma emenda entre as duas formas.
    -->
    <path fill="#D7DB00" d="M168 300 L256 300 L150 434 Z" />
    <rect x="96" y="104" width="320" height="238" rx="56" fill="#FFFFFF" />
  </g>

  <!--
    O "g" recortado, geométrico (anel mais haste) em vez de um recorte da Poppins: o
    traço da fonte afina demais para sobreviver a 16 px, e um SVG com texto dependeria
    de a fonte estar instalada em quem abre a aba.

    O anel ABRE onde a haste passa, como o bowl de um "g" de verdade encontra a haste.
    Sem essa abertura a forma se lê como "c" com um traço ao lado.

    O `translate`/`scale` foi medido no navegador, não estimado: o centro do "g" cai
    exatamente no centro do balão, com folga igual nos quatro lados.
  -->
  <g
    transform="translate(136.5 74.8) scale(4.51)"
    fill="none"
    stroke="#0059A9"
    stroke-width="7"
    stroke-linecap="round"
  >
    <path d="M34.9 19.9A11 11 0 1 0 34.9 34.1" />
    <path d="M37.5 18v22.5c0 5.9-3.9 9.2-9.2 9.2-3.3 0-6-1-7.9-2.7" />
  </g>
</svg>
